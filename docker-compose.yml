# Wealthfolio - Self-contained Docker Compose (builds from this repository)
#
# Builds the image from the local Dockerfile, so it works from a fresh clone
# without pulling a published image. For the published image, use compose.yml.
#
# 1. Create a .env file next to this file (single-quote the hash, see README):
#      WF_SECRET_KEY=<output of: openssl rand -base64 32>
#      WF_AUTH_PASSWORD_HASH='$argon2id$v=19$...'
#      WF_CORS_ALLOW_ORIGINS=http://localhost:8088
# 2. Start:
#      docker compose up -d --build
#
# Publishes port 8088 (override with WF_PORT).

services:
  wealthfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: wealthfolio:local
    container_name: wealthfolio
    restart: unless-stopped
    ports:
      - "${WF_PORT:-8088}:8088"
    volumes:
      - wealthfolio-data:/data
    environment:
      WF_LISTEN_ADDR: "0.0.0.0:8088"
      WF_DB_PATH: "/data/wealthfolio.db"
      # Required: the server refuses to start without a secret key.
      WF_SECRET_KEY: "${WF_SECRET_KEY:?Set WF_SECRET_KEY in .env (openssl rand -base64 32)}"
      # Required when listening on 0.0.0.0: Argon2id PHC hash of the login password.
      WF_AUTH_PASSWORD_HASH: "${WF_AUTH_PASSWORD_HASH:?Set WF_AUTH_PASSWORD_HASH in .env}"
      WF_AUTH_TOKEN_TTL_MINUTES: "${WF_AUTH_TOKEN_TTL_MINUTES:-60}"
      # Must match the origin you open in the browser.
      WF_CORS_ALLOW_ORIGINS: "${WF_CORS_ALLOW_ORIGINS:-http://localhost:8088}"
      WF_REQUEST_TIMEOUT_MS: "${WF_REQUEST_TIMEOUT_MS:-30000}"
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8088/api/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M

volumes:
  wealthfolio-data:
    driver: local
